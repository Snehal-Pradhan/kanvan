# Goal - To ensure the application is free from OWASP top 10 security issues
# BEFORE it reaches production — this scans the staging deployment
# (deploy-staging.yml) and prod (deploy.yml) only runs after it passes.

name: OWASP ZAP DAST Scan

on:
  workflow_call:

# Least privilege — the token only needs to read the repo.
permissions:
  contents: read

jobs:
  scan:
    # Self-hosted on purpose: staging listens on localhost:8090 of the deploy
    # runner, so the scan must run next to it. That also keeps the staging
    # environment off the public internet.
    runs-on: self-hosted
    steps:
      - name: Wait for staging to be healthy
        run: |
          timeout 60s bash -c 'until curl -sf http://localhost:8090/ >/dev/null; do sleep 2; done'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8090'
          # Gate on FAIL-level alerts only — `-I` stops warnings from failing
          # the job, so noisy-but-harmless findings don't block a deploy.
          # The action auto-attaches the HTML report as the `zap_scan` artifact.
          fail_action: true
          cmd_options: '-I'
          allow_issue_writing: false
