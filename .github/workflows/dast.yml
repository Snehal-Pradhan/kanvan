# Goal - To ensure my running application is free from OWASP top 10 security issues

name: OWASP ZAP DAST Scan

on:
  workflow_call:

# Least privilege — the token only needs to read the repo.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout 
        uses: actions/checkout@v4
      
      - name: Wait for services to be healthy
        run: |
          timeout 60s bash -c 'until curl -s --fail http://${{ secrets.EC2_HOST }}:8080; do sleep 2; done'
      
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://${{ secrets.EC2_HOST }}:8080'
          # Gate on FAIL-level alerts only — `-I` stops warnings from failing
          # the job, so noisy-but-harmless findings don't block a deploy.
          # The action auto-attaches the HTML report as the `zap_scan` artifact.
          fail_action: true
          cmd_options: '-I'
          allow_issue_writing: false
                
