#Goal: To deploy the built images from CI Steps once the CI Workflow is Succeeded

name: CD

# Reusable workflow — only cicd.yml may call this one, via "uses:".
on:
    workflow_call:
        inputs:
            image_tag:
                description: 'Tag to deploy. Leave blank for "latest".'
                required: false
                type: string
                default: ''
jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Copy Example Env to main Env
              run: cp .env.example .env

            - name: Docker Setup [Login]
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Deploy the containers with Docker Compose
              # docker-compose.yml falls back to :latest when IMAGE_TAG is empty.
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                docker compose pull
                docker compose up -d
            
            


