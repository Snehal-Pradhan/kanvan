# Goal - I have to do SAST for my Code

name: Code Quality 

on:
    workflow_call:

# Least privilege — the token only needs to read the repo.
permissions:
    contents: read

jobs:
    sast:
        runs-on: ubuntu-latest 

        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
         
            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
      
            - name: Install npm Packages
              run: npm install  --legacy-peer-deps
              working-directory: frontend

            - name: Run Linter
              run: npm run lint
              working-directory: frontend
          
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                # go-version-file alone — it wins over go-version anyway, and
                # pins the toolchain to exactly what backend/go.mod declares.
                go-version-file: 'backend/go.mod'
                cache-dependency-path: backend/go.sum
      
            - name: Run Go Formatter Check
              # `go fmt` rewrites files and exits 0 — it never fails CI. This
              # gates instead: list files needing formatting, fail if any.
              run: |
                unformatted=$(gofmt -l .)
                if [ -n "$unformatted" ]; then
                  echo "Files needing gofmt:"
                  echo "$unformatted"
                  exit 1
                fi
              working-directory: backend

            - name: Run Go Vet
              run: go vet
              working-directory: backend
         