# Goal - Put CI and CD together and delegate the real work to the reusable
# ci.yml and cd.yml. CD runs only if CI passed.

name: CI/CD

on:
  push:
    paths:
      - '**'
      - '!.github/workflows/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (blank = the sha tag CI just pushed)'
        required: false
        type: string
        default: ''

jobs:
  ci:
    name: CI - lint, test, build, push
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  cd:
    name: CD - deploy to server
    needs: ci
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}
    secrets: inherit
