# Goal - Push the image to DockerHub

name: Docker Push

on:
  workflow_call:

# Least privilege — the token only needs to read the repo
# (pushes authenticate with DOCKERHUB_TOKEN, not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ['backend','frontend']
    steps:  
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{matrix.folders}}
        uses: docker/build-push-action@v6
        with:
          context: ./${{matrix.folders}}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/kanvan-${{matrix.folders}}:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/kanvan-${{matrix.folders}}:latest
  

