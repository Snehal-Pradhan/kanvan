# Goal - To check whether the application code coverage doesn't have security threats/issues
name: Sonar Qube Scan

on:
    workflow_call:

# Least privilege — the scan only needs to read the repo.
permissions:
    contents: read

jobs:
    sonar-scan:
        runs-on: ubuntu-latest 
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Cache SonarQube Scanner
              # The scanner binary downloads on every run otherwise.
              uses: actions/cache@v6
              with:
                path: ~/.sonar/cache
                key: sonar-scanner
                restore-keys: sonar-scanner

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.2
              with:
                # Make the quality gate BINDING: the job polls SonarQube for
                # the gate result and FAILS if it's red. Without this, the
                # scan uploads results nobody enforces.
                args: >-
                  -Dsonar.qualitygate.wait=true
              env:
                SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
                SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}

            - name: Explain Quality Gate failure
              # A red gate used to be a dead end: the scanner only prints
              # "QUALITY GATE STATUS: FAILED" and leaves you to open the
              # dashboard. This queries the Web API for the gate result of
              # THIS analysis and prints exactly which conditions failed, so
              # the log tells you what to fix (and whether it's a code issue
              # or a condition that needs adjusting in SonarQube's UI).
              if: failure()
              env:
                SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
                SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
              run: |
                set -u
                echo "::group::Quality gate detail"
                # Auth goes in via curl's config file rather than `-u`, because
                # gitleaks' curl-auth-user rule flags any `-u "$VAR:"` as a
                # hardcoded credential and fails the secret-scanning job on a
                # false positive. The token still comes from the env.
                printf 'user = "%s:"\n' "$SONAR_TOKEN" > "$RUNNER_TEMP/.sonarcfg"
                status=$(curl -sf --config "$RUNNER_TEMP/.sonarcfg" \
                  "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=kanvan") || {
                  echo "Could not reach the SonarQube Web API at \$SONAR_HOST_URL"; exit 0; }
                echo "$status" | jq -r '
                  .projectStatus.status as $s
                  | "Gate status: \($s)", "",
                    (if $s == "OK" then "Gate passed." else
                       ( .projectStatus.conditions[]
                         | "  - \(.status | ascii_upcase): \(.metricKey) — actual \(.actualValue), gate requires \(.comparator) \(.period[0].value)" )
                     end)
                ' || echo "$status"

                # A count like "new_violations: 1" tells you nothing about WHAT
                # to fix. List the actual open issues on new code so the log
                # names the rule and the file:line.
                echo ""
                echo "Open issues on new code:"
                curl -sf --config "$RUNNER_TEMP/.sonarcfg" \
                  --get --data-urlencode "componentKeys=kanvan" \
                  --data-urlencode "inNewCodePeriod=true" \
                  --data-urlencode "resolved=false" \
                  "$SONAR_HOST_URL/api/issues/search" | jq -r '
                    (if (.total // 0) == 0 then "  (none)"
                     else (.issues[] |
                       "  - [\(.type)/\(.severity)] \(.rule) in \(.component):\(.line // "?")" +
                       (if .message then "\n      \(.message)" else "" end))
                     end)
                  ' || echo "  (could not query issues)"
                rm -f "$RUNNER_TEMP/.sonarcfg"
                echo "::endgroup::"

            