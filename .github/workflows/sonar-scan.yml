# Goal - To check whether the application code coverage doesn't have security threats/issues
name: Sonar Qube Scan

on:
    workflow_call:

# Least privilege — the scan only needs to read the repo.
permissions:
    contents: read

jobs:
    sonar-scan:
        runs-on: ubuntu-latest 
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            
            - name: Download Coverage Reports
              # Uploaded by code-tests.yml in the same run. Extracts to the
              # workspace root, matching the paths in sonar-project.properties.
              uses: actions/download-artifact@v4
              with:
                name: coverage-reports
                path: .
            
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.0
              env:
                SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
                SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}

            