# Goal - To check whether the application code coverage doesn't have security threats/issues
name: Sonar Qube Scan

on:
    workflow_call:

# Least privilege — the scan only needs to read the repo.
permissions:
    contents: read

jobs:
    sonar-scan:
        runs-on: ubuntu-latest 
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Cache SonarQube Scanner
              # The scanner binary downloads on every run otherwise.
              uses: actions/cache@v6
              with:
                path: ~/.sonar/cache
                key: sonar-scanner
                restore-keys: sonar-scanner

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.0
              with:
                # Make the quality gate BINDING: the job polls SonarQube for
                # the gate result and FAILS if it's red. Without this, the
                # scan uploads results nobody enforces.
                args: >-
                  -Dsonar.qualitygate.wait=true
              env:
                SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
                SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}

            