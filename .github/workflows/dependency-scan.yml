# Goal - I have to ensure the packages & dependencies have been audited for Security.

name: Dependency scan 

on:
    workflow_call:

# Least privilege — the token only needs to read the repo.
permissions:
    contents: read

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            
            - name: Setup go
              uses: actions/setup-go@v6
              with:
                go-version-file: 'backend/go.mod'
                cache-dependency-path: backend/go.sum

            - name: Install Govulncheck
              # NOTE the leading `v` — Go module versions need it (@1.1.4
              # fails with "unknown revision").
              run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
            
            - name: Go Vulncheck
              continue-on-error: true
              run: govulncheck ./... > govulncheck-report.txt
              working-directory: backend


            - name: Setup node 
              uses: actions/setup-node@v7
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Run Dependency Scan for Node
              run: npm audit 2>&1 | tee npm-audit-report.txt
              working-directory: frontend 

            - name: Upload Report to Artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: dependency-scan-report
                path: |
                    backend/govulncheck-report.txt
                    frontend/npm-audit-report.txt
                retention-days: 5
                if-no-files-found: warn
        
            
            
            