# Goal - I have to ensure the packages & dependencies have been audited for Security.

name: Dependency scan 

on:
    workflow_call:

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            
            - name: Setup go 
              uses: actions/setup-go@v6
              with:
                go-version: '1.22'
                go-version-file: 'go.mod'
                cache-dependency-path: go.sum

            - name: Install Govulncheck
              run: go install golang.org/x/vuln/cmd/govulncheck@1.1.4
            
            - name: Go Vulncheck
              continue-on-error: true
              run: govulncheck ./... > govulncheck-report.txt
              working-directory: backend


            - name: Setup node 
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Run Dependency Scan for Node
              run: npm audit 
              working-directory: frontend 

            - name: Upload Report to Artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report
                path: reports/dependency-report.txt 
                retention-days: 5
        
            
            
            