#   Goal - To ensure no secrets have been leaked in the code


name: Secrets Scanning

on:
    workflow_call

# Least privilege — gitleaks only needs to read the repo.
permissions:
    contents: read

jobs:
    scan-secrets:
        runs-on: ubuntu-latest 
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
              with:
                 fetch-depth: 0
            
            - name: GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
                