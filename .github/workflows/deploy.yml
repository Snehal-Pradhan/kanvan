#Goal: To deploy the built images from CI Steps once the CI Workflow is Succeeded

name: CD


on:
    workflow_call:
        inputs:
            # Which image tag to pull and deploy. docker-push builds both
            # sha-<commit> and latest — pin the deploy to the exact commit
            # that passed CI, so DAST scans what was actually built.
            image_tag:
                description: 'Image tag to deploy (e.g. sha-<commit sha>)'
                type: string
                default: 'latest'

# Least privilege — the token only needs to read the repo
# (image pulls authenticate with DOCKERHUB_TOKEN, not GITHUB_TOKEN).
permissions:
    contents: read

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Copy Example Env to main Env
              run: cp .env.example .env

            - name: Docker Setup [Login]
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Deploy the containers with Docker Compose
              # IMAGE_TAG comes from the caller — devsecops-ci passes the
              # sha-<commit> tag that docker-push just built and pushed.
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                docker compose pull
                docker compose up -d
            
            


