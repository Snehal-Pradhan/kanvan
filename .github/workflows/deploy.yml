#Goal: To deploy the built images from CI Steps once the CI Workflow is Succeeded

name: CD


on:
    workflow_call:
        inputs:
            # Which image tag to pull and deploy. docker-push builds both
            # sha-<commit> and latest — pin the deploy to the exact commit
            # that passed CI, so DAST scans what was actually built.
            image_tag:
                description: 'Image tag to deploy (e.g. sha-<commit sha>)'
                type: string
                default: 'latest'

# Least privilege — the token only needs to read the repo
# (image pulls authenticate with DOCKERHUB_TOKEN, not GITHUB_TOKEN).
permissions:
    contents: read

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Prepare Prod Env
              # Kept OUTSIDE the workspace (~/.kanvan/prod.env): actions/checkout
              # cleans untracked files every run, so a workspace .env would be
              # deleted and reseeded each deploy. Out here it survives, so the
              # guard is meaningful and manual tweaks on the server persist.
              run: |
                mkdir -p ~/.kanvan
                test -f ~/.kanvan/prod.env || cp .env.example ~/.kanvan/prod.env

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Deploy the containers with Docker Compose
              # IMAGE_TAG comes from the caller — devsecops-ci passes the
              # sha-<commit> tag that docker-push just built and pushed.
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                EF="--env-file $HOME/.kanvan/prod.env"

                # 1. Record what was running before this deploy (rollback point).
                cid=$(docker compose $EF ps -q backend 2>/dev/null || true)
                prev=latest
                if [ -n "$cid" ]; then
                  prev=$(docker inspect -f '{{.Config.Image}}' "$cid")
                  prev="${prev##*:}"
                fi

                # 2. Deploy the new images.
                docker compose $EF pull
                docker compose $EF up -d

                # 3. Health check — frontend page and backend /health through
                #    the host ports. If the new deploy doesn't come up, roll
                #    back to the previous tag and fail the job.
                check() {
                  timeout 90s bash -c 'until curl -sf http://localhost:8080/ >/dev/null; do sleep 3; done' && \
                  timeout 30s bash -c 'until curl -sf http://localhost:8081/health >/dev/null; do sleep 3; done'
                }
                if ! check; then
                  echo "::error::deploy of ${{ inputs.image_tag }} failed its health check — rolling back to ${prev}"
                  IMAGE_TAG="$prev" docker compose $EF pull
                  IMAGE_TAG="$prev" docker compose $EF up -d
                  exit 1
                fi

                # 4. Clean dangling build leftovers so the runner's disk doesn't
                #    fill over time. Old sha-* tags are kept on purpose — they
                #    are the rollback points.
                docker image prune -f
            
            


