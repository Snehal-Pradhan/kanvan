# Goal to install multiple versions of Go and do linting for multiple versions

name: Go Linter

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
    code-format:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false 
            matrix:
                go: ['1.22','1.23','1.24']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7 

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                # Matrix version only — go-version-file would override it and
                # silently pin every job to go.mod's version.
                go-version: ${{matrix.go}}
                cache-dependency-path: backend/go.sum

            - name: Run Go Formatter
              run: go fmt
              working-directory: backend

            - name: Run Go Vet
              run: go vet 
              working-directory: backend