name: Code Tests

on:
    workflow_call:

# Least privilege — the token only needs to read the repo.
permissions:
    contents: read

jobs:
    test:
        
        # Github Runner 

        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            
            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
      
            - name: Install npm Packages
              run: npm ci --legacy-peer-deps
              working-directory: frontend
            
            - name: Run Frontend Tests (with coverage)
              # test:coverage = vitest run --coverage → frontend/coverage/lcov.info
              run: npm run test:coverage
              working-directory: frontend
             
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version-file: 'backend/go.mod'
                cache-dependency-path: backend/go.sum
        
            - name: Run Backend Tests (with coverage)
              run: go test ./... -coverprofile=coverage.out
              working-directory: backend

            - name: Upload Coverage Reports
              # Sonar's job (sonar-scan.yml) downloads this artifact and feeds
              # it into the scan via sonar-project.properties.
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: coverage-reports
                path: |
                    backend/coverage.out
                    frontend/coverage/lcov.info
                retention-days: 5
                if-no-files-found: warn

