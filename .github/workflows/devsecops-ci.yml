# Goal - To run End to End DevSecOps CI Pipeline

name: DevSecOps
on:
    push:
      branches: [main]

# Least privilege for the whole run — called workflows inherit this floor.
permissions:
    contents: read

# One pipeline run per branch — a new push cancels the superseded run
# instead of racing it on the single self-hosted deploy runner.
concurrency:
    group: devsecops-${{ github.ref }}
    cancel-in-progress: true

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml
    
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml


    sonar_scan:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    code-tests:
        uses: ./.github/workflows/code-tests.yml

    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,code-tests,docker-checks,dependency-checks,secret-scanning,sonar_scan]
        secrets: inherit
    
    deploy:
        uses: ./.github/workflows/deploy.yml
        needs: [docker-push]
        with:
            # Pin the deploy to the exact commit that just passed CI —
            # docker-push tagged it sha-<sha> alongside latest.
            image_tag: sha-${{ github.sha }}
        secrets: inherit
    
    dast:
        uses: ./.github/workflows/dast.yml
        needs: [deploy]
        secrets: inherit

    