# Goal - To run End to End DevSecOps CI Pipeline

name: DevSecOps
on:
    push:
      branches: [main]

# Least privilege for the whole run — called workflows inherit this floor.
permissions:
    contents: read

# One pipeline run per branch — a new push cancels the superseded run
# instead of racing it on the single self-hosted deploy runner.
concurrency:
    group: devsecops-${{ github.ref }}
    cancel-in-progress: true

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml
    
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml


    sonar_scan:
        uses: ./.github/workflows/sonar-scan.yml
        # Downloads the coverage artifact from code-tests, so it has to wait
        # for the tests to finish. The quality gate enforces coverage on new
        # code — without this edge the gate is red by construction.
        secrets: inherit

    code-tests:
        uses: ./.github/workflows/code-tests.yml

    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,code-tests,docker-checks,dependency-checks,secret-scanning,sonar_scan]
        secrets: inherit
    
    # ── Promotion path: staging → DAST gate → prod ──────────────────────
    # Staging gets the exact sha-tag first, DAST scans it on the runner,
    # and only a clean scan promotes the same tag to production.
    deploy-staging:
        uses: ./.github/workflows/deploy-staging.yml
        needs: [docker-push]
        with:
            image_tag: sha-${{ github.sha }}
        secrets: inherit

    dast:
        uses: ./.github/workflows/dast.yml
        # DAST now gates PROD: it scans the staging deployment of the exact
        # sha-tag; deploy.yml (production) only runs after this passes.
        secrets: inherit
        needs: [deploy-staging]

    deploy:
        uses: ./.github/workflows/deploy.yml
        needs: [dast]
        with:
            # Pin the deploy to the exact commit that just passed CI —
            # docker-push tagged it sha-<sha> alongside latest.
            image_tag: sha-${{ github.sha }}
        secrets: inherit

    notify:
        # Fires when any ancestor job failed — including jobs that were
        # skipped because an earlier one failed. Needs SLACK_WEBHOOK_URL
        # (incoming webhook) in repo secrets.
        if: failure()
        needs: [deploy]
        runs-on: ubuntu-latest
        steps:
            - name: Notify Slack on pipeline failure
              run: |
                payload=$(printf '{"text":"DevSecOps pipeline FAILED on main - run https://github.com/%s/actions/runs/%s (by %s)"}' \
                  "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_ACTOR")
                curl -sf -X POST -H 'Content-Type: application/json' \
                  -d "$payload" "${{ secrets.SLACK_WEBHOOK_URL }}"

    