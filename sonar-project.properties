sonar.projectKey=kanvan
sonar.projectName=kanvan

sonar.sources=backend,frontend
sonar.tests=backend,frontend

# Don't analyze generated output — it's noise, and it drags the metrics down.
sonar.exclusions=frontend/coverage/**,frontend/dist/**,frontend/node_modules/**,**/node_modules/**
sonar.test.inclusions=frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,backend/**/*_test.go

# No coverage report paths on purpose. Importing coverage would force sonar_scan
# to wait on code-tests, serializing the pipeline — static analysis doesn't need
# tests to run, only SAST speed matters here. Tests still upload the coverage
# reports as a CI artifact for humans to read. If you later want coverage in the
# gate, add the two reportPaths lines below AND accept the needs: [code-tests]
# edge in devsecops-ci.yml:
#   sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
#   sonar.go.coverage.reportPaths=backend/coverage.out
#   sonar.coverage.exclusions=frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,backend/**/*_test.go