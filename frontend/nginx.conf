server {
    listen 4173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA calls same-origin /api/* (see src/api/client.js), so nginx is the
    # gateway. `backend` is the compose service name and 8080 is the Go app's
    # container port — it must match BACKEND_PORT in .env.
    #
    # The trailing slash on proxy_pass is what strips the /api prefix: the Go
    # backend mounts its routes at the root (/projects, /tasks, /search), not
    # under /api. This mirrors the `rewrite` in vite.config.js's preview proxy.
    # `^~` keeps this prefix match ahead of the static-asset regex below.
    location ^~ /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}